name: Verify Aether private repository Pages

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/verify-aether-deployment.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-aether-private-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SITE_URL: https://fabiodr.github.io/reducewatch-proto1/
      EXPECTED_REPOSITORY: fabiodr/reducewatch-proto1
      EXPECTED_SOURCE_SHA: 4c531c8649002e91cd4df4ca2c1b0e2c9610afe3
      VERIFY_ATTEMPTS: "30"
      VERIFY_INTERVAL_SECONDS: "20"
    steps:
      - name: Checkout verification repository
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Verify the private Pages manifest and every published file
        shell: bash
        run: |
          python3 <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          site_url = os.environ["SITE_URL"]
          expected_repository = os.environ["EXPECTED_REPOSITORY"]
          expected_source_sha = os.environ["EXPECTED_SOURCE_SHA"].lower()
          attempts = int(os.environ["VERIFY_ATTEMPTS"])
          interval = int(os.environ["VERIFY_INTERVAL_SECONDS"])

          if not site_url.startswith("https://") or not site_url.endswith("/"):
              raise SystemExit("SITE_URL must be an HTTPS directory URL.")
          if len(expected_source_sha) != 40:
              raise SystemExit("EXPECTED_SOURCE_SHA must be a full SHA.")

          def safe_url(path, cache_bust):
              if not isinstance(path, str) or not path or path.startswith("/") or "\\" in path:
                  raise ValueError(f"Unsafe manifest path: {path!r}")
              parts = path.split("/")
              if any(not part or urllib.parse.unquote(part) in {".", ".."} for part in parts):
                  raise ValueError(f"Unsafe manifest path: {path!r}")
              url = urllib.parse.urljoin(site_url, path)
              parsed_site = urllib.parse.urlparse(site_url)
              parsed_url = urllib.parse.urlparse(url)
              if parsed_url.netloc != parsed_site.netloc or not parsed_url.path.startswith(parsed_site.path):
                  raise ValueError(f"Manifest path escapes site: {path}")
              separator = "&" if "?" in url else "?"
              return f"{url}{separator}aether_verify={cache_bust}"

          def fetch(path, cache_bust):
              request = urllib.request.Request(
                  safe_url(path, cache_bust),
                  headers={
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "Aether-Private-Pages-Verifier/1.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  final = urllib.parse.urlparse(response.geturl())
                  expected = urllib.parse.urlparse(site_url)
                  if final.netloc != expected.netloc:
                      raise RuntimeError(f"Cross-origin redirect for {path}: {response.geturl()}")
                  return response.read(), response.headers.get("content-type", "")

          def expected_content_type(path):
              if path == "index.html":
                  return "text/html"
              if path.endswith(".css"):
                  return "text/css"
              if path.endswith(".js"):
                  return "javascript"
              if path.endswith(".svg"):
                  return "image/svg+xml"
              return None

          def verify_once():
              cache_bust = f"{int(time.time() * 1000)}-{expected_source_sha}"
              manifest_bytes, manifest_type = fetch("deployment.json", cache_bust)
              if "json" not in manifest_type.lower() and "octet-stream" not in manifest_type.lower():
                  raise RuntimeError(f"Unexpected deployment.json content type: {manifest_type}")
              manifest = json.loads(manifest_bytes)

              if manifest.get("schema_version") != 1:
                  raise RuntimeError(f"Unexpected manifest schema: {manifest.get('schema_version')}")
              if manifest.get("source_repository") != expected_repository:
                  raise RuntimeError(f"Wrong source repository: {manifest.get('source_repository')}")
              if manifest.get("source_sha") != expected_source_sha:
                  raise RuntimeError(
                      f"Wrong source SHA: {manifest.get('source_sha')} != {expected_source_sha}"
                  )
              if manifest.get("source_ref") != "main":
                  raise RuntimeError(f"Wrong source ref: {manifest.get('source_ref')}")
              if manifest.get("public_url") != site_url:
                  raise RuntimeError(f"Wrong canonical URL: {manifest.get('public_url')}")

              for key in ("workflow_run_id", "artifact_id"):
                  if not isinstance(manifest.get(key), int) or manifest[key] <= 0:
                      raise RuntimeError(f"Invalid {key}: {manifest.get(key)}")
              if not isinstance(manifest.get("artifact_name"), str) or not manifest["artifact_name"]:
                  raise RuntimeError("Missing artifact_name")
              if not isinstance(manifest.get("artifact_sha256"), str) or len(manifest["artifact_sha256"]) != 64:
                  raise RuntimeError("Invalid artifact_sha256")

              files = manifest.get("files")
              if not isinstance(files, dict) or not files:
                  raise RuntimeError("Manifest has no file inventory")
              paths = sorted(files)
              if any(path.endswith(".map") for path in paths):
                  raise RuntimeError("Private Pages exposes a source map")

              required = [
                  "index.html",
                  "favicon.svg",
              ]
              for path in required:
                  if path not in files:
                      raise RuntimeError(f"Missing required file: {path}")
              if not any(path.startswith("assets/index-") and path.endswith(".js") for path in paths):
                  raise RuntimeError("Missing application JavaScript")
              if not any(path.startswith("assets/index-") and path.endswith(".css") for path in paths):
                  raise RuntimeError("Missing application CSS")
              if not any(path.startswith("assets/maplibre-gl-worker-") and path.endswith(".js") for path in paths):
                  raise RuntimeError("Missing MapLibre worker")

              def verify_file(path):
                  expected = files[path]
                  if not isinstance(expected, dict):
                      raise RuntimeError(f"Invalid file metadata: {path}")
                  expected_hash = expected.get("sha256")
                  expected_bytes = expected.get("bytes")
                  if not isinstance(expected_hash, str) or len(expected_hash) != 64:
                      raise RuntimeError(f"Invalid SHA-256 metadata: {path}")
                  if not isinstance(expected_bytes, int) or expected_bytes <= 0:
                      raise RuntimeError(f"Invalid byte metadata: {path}")

                  payload, content_type = fetch(path, cache_bust)
                  actual_hash = hashlib.sha256(payload).hexdigest()
                  if actual_hash != expected_hash:
                      raise RuntimeError(f"SHA-256 mismatch: {path}")
                  if len(payload) != expected_bytes:
                      raise RuntimeError(f"Byte-size mismatch: {path}")
                  expected_type = expected_content_type(path)
                  if expected_type and expected_type not in content_type.lower():
                      raise RuntimeError(
                          f"Content-type mismatch for {path}: {content_type or '<missing>'}"
                      )
                  return path

              with concurrent.futures.ThreadPoolExecutor(max_workers=min(8, len(paths))) as pool:
                  verified_paths = sorted(pool.map(verify_file, paths))

              index_bytes, _ = fetch("index.html", cache_bust)
              if "Aether — Climate Futures Atlas" not in index_bytes.decode("utf-8"):
                  raise RuntimeError("Index title did not match Aether")

              return manifest, verified_paths

          last_error = None
          for attempt in range(1, attempts + 1):
              try:
                  manifest, verified_paths = verify_once()
                  checked_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
                  evidence = {
                      "status": "verified",
                      "checked_at": checked_at,
                      "public_url": site_url,
                      "source_repository": manifest["source_repository"],
                      "source_ref": manifest["source_ref"],
                      "source_sha": manifest["source_sha"],
                      "validation_workflow_run_id": manifest["workflow_run_id"],
                      "artifact_id": manifest["artifact_id"],
                      "artifact_name": manifest["artifact_name"],
                      "artifact_sha256": manifest["artifact_sha256"],
                      "verified_file_count": len(verified_paths),
                      "verified_files": verified_paths,
                      "checks": [
                          "private repository Pages manifest matched merged main",
                          "validation run and retained artifact identity present",
                          "every inventoried file matched SHA-256 and byte size",
                          "HTML, JavaScript, CSS, SVG content types matched",
                          "no production source maps were exposed",
                      ],
                  }
                  Path("/tmp/aether-private-pages-verification.json").write_text(
                      json.dumps(evidence, indent=2, sort_keys=True) + "\n"
                  )
                  print(json.dumps(evidence, indent=2, sort_keys=True))
                  break
              except Exception as error:
                  last_error = error
                  print(f"Verification attempt {attempt}/{attempts} failed: {error}")
                  if attempt < attempts:
                      time.sleep(interval)
          else:
              raise SystemExit(f"Private Pages verification failed: {last_error}")
          PY

      - name: Record independently verified deployment
        shell: bash
        run: |
          target=reducewatch-proto1-private-pages-verification.json
          cp /tmp/aether-private-pages-verification.json "$target"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"

          if git diff --cached --quiet; then
            echo "Verification evidence is unchanged."
          else
            source_sha=$(python3 -c 'import json; print(json.load(open("reducewatch-proto1-private-pages-verification.json"))["source_sha"])')
            git commit -m "verify Aether private Pages ${source_sha:0:12}"
            git push origin HEAD:master
          fi

      - name: Publish verification summary
        shell: bash
        run: |
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          evidence = json.load(open("reducewatch-proto1-private-pages-verification.json"))
          print("## Aether private repository Pages verification")
          print()
          print(f"- Status: **{evidence['status']}**")
          print(f"- URL: {evidence['public_url']}")
          print(f"- Source: `{evidence['source_sha']}`")
          print(f"- Validation run: `{evidence['validation_workflow_run_id']}`")
          print(f"- Artifact: `{evidence['artifact_name']}`")
          print(f"- Artifact ID: `{evidence['artifact_id']}`")
          print(f"- Artifact SHA-256: `{evidence['artifact_sha256']}`")
          print(f"- Verified files: `{evidence['verified_file_count']}`")
          print(f"- Checked at: `{evidence['checked_at']}`")
          PY
