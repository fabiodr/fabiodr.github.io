name: Verify Aether Pages endpoint

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/verify-aether-deployment.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-aether-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout published site
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Verify the real HTTPS endpoint and exact artifact bytes
        env:
          SITE_URL: https://fabiodr.github.io/reducewatch-proto1/
          EXPECTED_ARTIFACT_SHA256: 3f80d458dd8d5841109509f29cf90f8fca55042ef41f89233318413ea6c7a9ae
          EXPECTED_MERGE_COMMIT: 80398fa0a171cb5123c1b3134faaa22b8ee791f0
          EXPECTED_INDEX_SHA256: cc2f83ce26cbf4bcf6a7c65d1f50facd0da3c19f27866810f109b4ab05968243
          EXPECTED_SCRIPT_SHA256: ec43793266a1507f3d18ff41d87754b97eec386247616504bb7bbe1aa9915d9e
          EXPECTED_STYLE_SHA256: 40f5e03cd55b1246a8fe7f46944a1e9f40c529ff5c0b35d280b0f54051fc34b5
          EXPECTED_WORKER_SHA256: 5d486ed10fde8915b68bdb6e69ca7e847973369bb41f591870c89c240fa792ae
        run: |
          verified=false
          for attempt in $(seq 1 72); do
            echo "HTTPS verification attempt $attempt/72"
            rm -f /tmp/deployment.json /tmp/index.html /tmp/app.js /tmp/app.css /tmp/worker.js

            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                "${SITE_URL}deployment.json" -o /tmp/deployment.json \
              && grep --fixed-strings --quiet "$EXPECTED_ARTIFACT_SHA256" /tmp/deployment.json \
              && grep --fixed-strings --quiet "$EXPECTED_MERGE_COMMIT" /tmp/deployment.json \
              && curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                "$SITE_URL" -o /tmp/index.html \
              && grep --fixed-strings --quiet "Aether — Climate Futures Atlas" /tmp/index.html \
              && curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                "${SITE_URL}assets/index-CZnudtFU.js" -o /tmp/app.js \
              && curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                "${SITE_URL}assets/index-CkQqKH4J.css" -o /tmp/app.css \
              && curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                "${SITE_URL}assets/maplibre-gl-worker-BtpYDTzw.js" -o /tmp/worker.js \
              && echo "$EXPECTED_INDEX_SHA256  /tmp/index.html" | sha256sum --check --strict \
              && echo "$EXPECTED_SCRIPT_SHA256  /tmp/app.js" | sha256sum --check --strict \
              && echo "$EXPECTED_STYLE_SHA256  /tmp/app.css" | sha256sum --check --strict \
              && echo "$EXPECTED_WORKER_SHA256  /tmp/worker.js" | sha256sum --check --strict; then
              verified=true
              break
            fi
            sleep 10
          done
          test "$verified" = true

      - name: Record successful verification
        env:
          SITE_URL: https://fabiodr.github.io/reducewatch-proto1/
          PUBLISHED_COMMIT: 3d8dd176da9a444271e270edd8ceb1b871714d86
          SOURCE_HEAD_SHA: 35afae3476048ecddb894a8f4d62fc2748ed7223
          CANDIDATE_MERGE_SHA: d690948b67fccd5da6dc5dc4642d6087648433af
          MERGE_COMMIT_SHA: 80398fa0a171cb5123c1b3134faaa22b8ee791f0
          ARTIFACT_ID: "9388771030"
          ARTIFACT_SHA256: 3f80d458dd8d5841109509f29cf90f8fca55042ef41f89233318413ea6c7a9ae
        run: |
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > reducewatch-proto1/verification.json <<JSON
          {
            "status": "verified",
            "checked_at": "$checked_at",
            "public_url": "$SITE_URL",
            "published_commit": "$PUBLISHED_COMMIT",
            "source_head_sha": "$SOURCE_HEAD_SHA",
            "candidate_merge_sha": "$CANDIDATE_MERGE_SHA",
            "merge_commit_sha": "$MERGE_COMMIT_SHA",
            "artifact_id": $ARTIFACT_ID,
            "artifact_sha256": "$ARTIFACT_SHA256",
            "checks": [
              "index HTTPS success and exact SHA-256",
              "deployment metadata matched artifact and merge commit",
              "JavaScript HTTPS success and exact SHA-256",
              "CSS HTTPS success and exact SHA-256",
              "MapLibre worker HTTPS success and exact SHA-256"
            ]
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reducewatch-proto1/verification.json
          git commit -m "verify merged Aether deployment"
          git push origin HEAD:master
