name: Verify Aether Pages endpoint

on:
  push:
    branches: [master]
    paths:
      - reducewatch-proto1/**
      - .github/workflows/verify-aether-deployment.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-aether-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout published site
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Load deployment contract
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          deployment = json.loads(Path("reducewatch-proto1/deployment.json").read_text())
          identity = deployment["dist_identity"]
          required = {
              "SITE_URL": deployment["public_url"],
              "ARTIFACT_ID": str(deployment["artifact_id"]),
              "ARTIFACT_SHA256": deployment["artifact_sha256"],
              "SOURCE_HEAD_SHA": deployment["source_head_sha"],
              "CANDIDATE_MERGE_SHA": deployment["candidate_merge_sha"],
              "MERGE_COMMIT_SHA": deployment["merge_commit_sha"],
              "INDEX_PATH": "index.html",
              "INDEX_SHA256": identity["index.html"],
              "SCRIPT_PATH": next(key for key in identity if key.endswith(".js") and "worker" not in key),
              "STYLE_PATH": next(key for key in identity if key.endswith(".css")),
              "WORKER_PATH": next(key for key in identity if "worker" in key and key.endswith(".js")),
          }
          required["SCRIPT_SHA256"] = identity[required["SCRIPT_PATH"]]
          required["STYLE_SHA256"] = identity[required["STYLE_PATH"]]
          required["WORKER_SHA256"] = identity[required["WORKER_PATH"]]

          with Path("/tmp/deployment-env").open("w") as handle:
              for key, value in required.items():
                  handle.write(f"{key}={value}\n")
          PY
          cat /tmp/deployment-env >> "$GITHUB_ENV"

      - name: Verify real HTTPS origin and exact artifact bytes
        shell: bash
        run: |
          verified=false
          for attempt in $(seq 1 72); do
            echo "HTTPS verification attempt $attempt/72"
            rm -rf /tmp/aether-verification
            mkdir -p /tmp/aether-verification

            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                "${SITE_URL}deployment.json" -o /tmp/aether-verification/deployment.json \
              && cmp --silent reducewatch-proto1/deployment.json /tmp/aether-verification/deployment.json \
              && curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                "${SITE_URL}${INDEX_PATH}" -o /tmp/aether-verification/index.html \
              && grep --fixed-strings --quiet "Aether — Climate Futures Atlas" /tmp/aether-verification/index.html \
              && curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                "${SITE_URL}${SCRIPT_PATH}" -o /tmp/aether-verification/app.js \
              && curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                "${SITE_URL}${STYLE_PATH}" -o /tmp/aether-verification/app.css \
              && curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                "${SITE_URL}${WORKER_PATH}" -o /tmp/aether-verification/worker.js \
              && echo "$INDEX_SHA256  /tmp/aether-verification/index.html" | sha256sum --check --strict \
              && echo "$SCRIPT_SHA256  /tmp/aether-verification/app.js" | sha256sum --check --strict \
              && echo "$STYLE_SHA256  /tmp/aether-verification/app.css" | sha256sum --check --strict \
              && echo "$WORKER_SHA256  /tmp/aether-verification/worker.js" | sha256sum --check --strict; then
              verified=true
              break
            fi
            sleep 10
          done
          test "$verified" = true

      - name: Create verification evidence
        shell: bash
        run: |
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > /tmp/aether-verification/verification.json <<JSON
          {
            "status": "verified",
            "checked_at": "$checked_at",
            "public_url": "$SITE_URL",
            "mirror_commit_sha": "$GITHUB_SHA",
            "source_head_sha": "$SOURCE_HEAD_SHA",
            "candidate_merge_sha": "$CANDIDATE_MERGE_SHA",
            "merge_commit_sha": "$MERGE_COMMIT_SHA",
            "artifact_id": $ARTIFACT_ID,
            "artifact_sha256": "$ARTIFACT_SHA256",
            "checks": [
              "deployment metadata exact match",
              "index HTTPS success and exact SHA-256",
              "application JavaScript HTTPS success and exact SHA-256",
              "application CSS HTTPS success and exact SHA-256",
              "MapLibre worker HTTPS success and exact SHA-256"
            ]
          }
          JSON

          cat >> "$GITHUB_STEP_SUMMARY" <<MARKDOWN
          ## Aether Pages verification

          - Status: **verified**
          - Public URL: $SITE_URL
          - Mirror commit: \\`$GITHUB_SHA\`
          - Source merge: \\`$MERGE_COMMIT_SHA\`
          - Candidate merge: \\`$CANDIDATE_MERGE_SHA\`
          - Artifact ID: \\`$ARTIFACT_ID\`
          - Artifact SHA-256: \\`$ARTIFACT_SHA256\`
          - Checked at: $checked_at

          Exact HTTPS hashes passed for the HTML, application JavaScript, CSS, and MapLibre worker. The verifier did not modify the repository.
          MARKDOWN

      - name: Upload verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: aether-pages-verification-${{ github.sha }}
          path: /tmp/aether-verification/verification.json
          if-no-files-found: error
          retention-days: 30
